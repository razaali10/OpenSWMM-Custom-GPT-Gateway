services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      OPENSWMM_MCP_URL: ${OPENSWMM_MCP_URL:-https://openswmm.onrender.com/mcp}
      OPENSWMM_MCP_TIMEOUT_SECONDS: ${OPENSWMM_MCP_TIMEOUT_SECONDS:-30}
      MCP_SIMULATION_TIMEOUT_SECONDS: ${MCP_SIMULATION_TIMEOUT_SECONDS:-300}
      MCP_OPTIMIZATION_TIMEOUT_SECONDS: ${MCP_OPTIMIZATION_TIMEOUT_SECONDS:-30}
      MCP_TOOL_CACHE_TTL_SECONDS: ${MCP_TOOL_CACHE_TTL_SECONDS:-300}
      AUTH_MODE: ${AUTH_MODE:-api_key}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
