components:
  schemas:
    EngineeringSummaryResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        inventory:
          additionalProperties: true
          type: object
          title: Inventory
        integrity:
          additionalProperties: true
          type: object
          title: Integrity
        flooding:
          additionalProperties: true
          type: object
          title: Flooding
        twod_active:
          type: boolean
          title: Twod Active
        limitations:
          items:
            type: string
          type: array
          title: Limitations
      type: object
      required:
      - session_id
      - inventory
      - integrity
      - flooding
      - twod_active
      - limitations
      title: EngineeringSummaryResponse
    FloodedNode:
      properties:
        node_id:
          type: string
          title: Node Id
        total_flood_volume:
          anyOf:
          - type: number
          - type: 'null'
          title: Total Flood Volume
        max_depth:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Depth
        time_flooded:
          anyOf:
          - type: number
          - type: 'null'
          title: Time Flooded
      type: object
      required:
      - node_id
      - total_flood_volume
      - max_depth
      - time_flooded
      title: FloodedNode
    FloodingAnalysisResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        flooded_node_count:
          type: integer
          title: Flooded Node Count
        flooded_nodes:
          items:
            $ref: '#/components/schemas/FloodedNode'
          type: array
          title: Flooded Nodes
      type: object
      required:
      - session_id
      - flooded_node_count
      - flooded_nodes
      title: FloodingAnalysisResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ModelInventoryResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        counts:
          additionalProperties: true
          type: object
