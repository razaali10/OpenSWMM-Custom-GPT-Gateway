    ToolCallRequest:
      properties:
        tool_name:
          type: string
          title: Tool Name
        arguments:
          type: string
          title: Arguments
          description: 'REQUIRED. JSON-encoded object of the tool''s arguments, e.g. ''{"session_id":
            "my_session"}''. Not a nested JSON object -- a string containing JSON text. Pass
            ''{}'' only if the tool genuinely takes no arguments -- if the user specified any
            value (a session_id, an ID, a number...), it MUST appear inside this JSON string
            or the call will use the tool''s own defaults instead of what was asked for. See
            examples.'
      type: object
      required:
      - tool_name
      - arguments
      title: ToolCallRequest
      description: 'Generic grouped-dispatcher request body -- deliberately not one

        giant Pydantic model per tool (project brief section 28). The

        upstream MCP server validates the tool''s actual arguments against its

        real schema; this gateway only validates that `tool_name` exists and

        belongs to the endpoint''s action group before forwarding.


        `arguments` is a JSON-ENCODED STRING, not a nested object -- e.g.

        ''{"session_id": "my_session"}''. This is deliberate, not a REST

        convention choice: three separate live tests against a real Custom

        GPT showed the model unable to populate a bare `{type: object,

        additionalProperties: true}` field with no listed `properties` --

        ChatGPT''s Actions layer appears to treat such a field as having no

        fillable keys at all, regardless of the field''s own examples, and the

        model reported (incorrectly) that the dispatcher itself rejected

        ordinary arguments like session_id. A `string` field has no such

        "closed object" ambiguity: the model can always construct the JSON

        text freely. The gateway parses it back into a dict before forwarding

        to the upstream tool (see app/services/dispatcher.py). Include every

        key from the tool''s own input_schema (via getOpenSwmmToolSchema) that

        you want to set -- there is no allow-list and nothing is

        special-cased or rejected, session_id included.


        `arguments` has no default (required, even for a no-argument call --

        pass ''{}'') on purpose: a later live retest after the string-typed fix

        above still showed the model silently falling back to an empty/default

        payload instead of composing the requested session_id -- it never

        re-tried the failing call, it just accepted its own empty result.

        Removing the default and marking the field required is meant to close

        that specific failure mode by making the model responsible for typing

        out a real value on every call, not something it can quietly skip.'
      examples:
      - tool_name: building_create_model
        arguments: '{"session_id": "my_session"}'
      - tool_name: links_set_loss_coeff
        arguments: '{"session_id": "my_session", "link_id": "C1", "inlet": 0.5, "outlet": 1.0,
          "avg": 0.0}'
    ToolCallResponse:
      properties:
        success:
          type: boolean
          title: Success
        tool_name:
          type: string
          title: Tool Name
        result:
          title: Result
        warnings:
          items:
            type: string
          type: array
          title: Warnings
      type: object
      required:
      - success
      - tool_name
      title: ToolCallResponse
