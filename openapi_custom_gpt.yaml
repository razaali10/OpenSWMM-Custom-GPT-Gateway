# Generated from the live /openapi.json (see docs/CUSTOM_GPT_SETUP.md).
# Edit only the servers: URL below before importing into GPT Actions --
# everything else should be regenerated, not hand-edited, when the app changes.
openapi: 3.1.0
info:
  title: OpenSWMM Custom GPT Gateway
  description: Dynamic dispatcher gateway exposing the full ~565-tool OpenSWMM MCP registry through ~11
    grouped Actions plus discovery and engineering endpoints. Use searchOpenSwmmTools/getOpenSwmmToolSchema
    to find the right tool and its real arguments, then call the matching call<Group>Tool Action. Never
    fabricate a tool name or argument -- always discover it first.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - system
      summary: Liveness check -- never requires auth
      operationId: healthCheck
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Healthcheck
      security: []
  /api/v1/status:
    get:
      tags:
      - system
      summary: Liveness plus upstream MCP connectivity and live tool count -- never requires auth
      operationId: getGatewayStatus
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Getgatewaystatus
      security: []
  /api/v1/mcp/namespaces:
    get:
      tags:
      - discovery
      summary: List every tool namespace and action group on the live upstream server, with counts
      operationId: listOpenSwmmNamespaces
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespacesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/mcp/search:
    post:
      tags:
      - discovery
      summary: Search the live tool registry by name, namespace, description, or argument names
      operationId: searchOpenSwmmTools
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolSearchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolSearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/mcp/tools/{tool_name}:
    get:
      tags:
      - discovery
      summary: Get one tool's live description, input schema, action group, and safety classification
      operationId: getOpenSwmmToolSchema
      parameters:
      - name: tool_name
        in: path
        required: true
        schema:
          type: string
          title: Tool Name
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolSchemaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tools/core:
    post:
      tags:
      - grouped-tools
      summary: Call a lifecycle_*/model_*/datetime_* tool
      description: 'Dispatches to any tool whose action group is ''core'' (namespaces: lifecycle_, model_,
        datetime_). Rejects tool_name values that belong to a different action group -- call the correct
        /api/v1/tools/{group} endpoint instead, per the error''s correct_action_group field.'
      operationId: callSwmmCoreTool
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
